<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock H — The Minimum · Karan Kapoor</title>
<style>
@font-face{font-family:'Newsreader';src:url('fonts/Newsreader-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Newsreader';src:url('fonts/Newsreader-400-italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Newsreader';src:url('fonts/Newsreader-500-italic.woff2') format('woff2');font-weight:500;font-style:italic;font-display:swap}

:root{
  --yellow:#FDDA0D;
  --ink:#000000;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--yellow);color:var(--ink);
  font-family:'Newsreader',Georgia,serif;
  font-size:1.25rem;line-height:1.6;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--ink)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
::selection{background:var(--ink);color:var(--yellow)}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{max-width:34rem;text-align:center}
h1{
  font-weight:500;font-style:italic;font-size:clamp(3rem,9vw,5.2rem);
  line-height:1.05;letter-spacing:-.01em;
}
.line{margin-top:1.4rem;font-size:1.2rem}
.line em{font-style:italic}
nav{margin-top:3rem}
nav ul{list-style:none;display:flex;justify-content:center;gap:2.6rem}
nav a{
  font-size:.95rem;letter-spacing:.24em;text-transform:uppercase;
  text-decoration:none;border-bottom:2px solid var(--ink);padding-bottom:.3rem;
}
nav a:hover{background:var(--ink);color:var(--yellow);border-color:var(--ink)}

footer{padding:1.8rem 2rem;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:1rem}
footer a{font-size:.9rem;font-style:italic;text-decoration:none}
footer a:hover{text-decoration:underline;text-underline-offset:4px}
footer .links{display:flex;gap:1.6rem;flex-wrap:wrap}
@media (max-width:480px){
  nav ul{flex-direction:column;gap:1.4rem}
  footer{justify-content:center;text-align:center}
}
</style>
</head>
<body>

<main>
  <div class="card">
    <h1>Karan Kapoor</h1>
    <p class="line">Poet &amp; editor. <em>THIRST</em> — forthcoming from <a href="https://www.alicejamesbooks.org/bookstore/thirst">Alice James Books</a>, April 2028.</p>
    <nav aria-label="Primary">
      <ul>
        <li><a href="#">About</a></li>
        <li><a href="#">Poems</a></li>
        <li><a href="#">Photographs</a></li>
      </ul>
    </nav>
  </div>
</main>

<footer>
  <a href="mailto:karan@onlypoems.com">karan@onlypoems.com</a>
  <div class="links">
    <a href="https://onlypoems.com/">ONLY POEMS</a>
    <a href="https://www.strangepilgrims.com/">Strange Pilgrims</a>
    <a href="https://www.instagram.com/whyareyounotreading/">Instagram</a>
    <a href="https://substack.com/@poetkarankapoor">Substack</a>
  </div>
</footer>

</body>
</html>
