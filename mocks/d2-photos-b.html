body{background:var(--ink);color:var(--paper)}
::selection{background:var(--yellow);color:var(--ink)}
.head-band{border-bottom:1px solid var(--rule-inv)}
.titlebox{padding-block:clamp(2.2rem,5vw,3.6rem)}
h1{font-family:'Fraunces',Georgia,serif;font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem,7vw,5rem);line-height:1;color:var(--yellow);font-variation-settings:'opsz' 144}
.epigraph{padding-block:clamp(2.4rem,5vw,3.6rem)}
.epigraph p{font-size:clamp(1.25rem,2.4vw,1.6rem);font-style:italic}
.epigraph cite{display:block;margin-top:.5rem;font-style:normal;font-family:'Fraunces',Georgia,serif;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-inv)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(2rem,5vw,4rem);padding-bottom:clamp(3rem,6vw,5rem)}
.ph:nth-child(3n){grid-column:span 2;max-width:52rem;justify-self:center}
.ph a{display:block;transition:transform .18s, box-shadow .18s}
.ph a:hover{transform:translateY(-4px);box-shadow:var(--lift-shadow-inv)}
.ph img{width:100%}
.ph figcaption{margin-top:.6rem;font-style:italic;font-size:.98rem;color:var(--yellow)}

/* lightbox */
.lb[hidden]{display:none}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:flex;align-items:center;justify-content:center}
.lb figure{max-width:min(92vw,1200px);max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.lb img{max-width:100%;max-height:84vh;width:auto;height:auto;object-fit:contain}
.lb figcaption{color:var(--yellow);font-style:italic;font-size:1.05rem}
.lb button{
  position:absolute;background:none;border:0;color:#fff;font-size:2rem;cursor:pointer;padding:1rem;
  font-family:'Fraunces',Georgia,serif;transition:transform .18s,color .18s;
}
.lb button:hover{color:var(--yellow);transform:translateY(-2px)}
.lb button:focus-visible{outline:2px solid var(--yellow)}
.lb-close{top:.6rem;right:1rem}
.lb-prev{left:1rem;top:50%;transform:translateY(-50%)}
.lb-next{right:1rem;top:50%;transform:translateY(-50%)}
.lb-prev:hover{transform:translateY(-50%) translateX(-3px)}
.lb-next:hover{transform:translateY(-50%) translateX(3px)}

@media (max-width:680px){.grid{grid-template-columns:1fr}.ph:nth-child(3n){grid-column:auto}.site-head{flex-direction:column;gap:1rem;align-items:flex-start}}
</style>

<script>
(function(){
  var links=[].slice.call(document.querySelectorAll('.phlink'));
  var lb=document.getElementById('lb'), img=lb.querySelector('img'), cap=lb.querySelector('figcaption'), idx=-1;
  function show(i){
    idx=(i+links.length)%links.length;
    img.src=links[idx].href; img.alt=links[idx].dataset.title; cap.textContent=links[idx].dataset.title;
    lb.hidden=false; document.body.style.overflow='hidden'; lb.querySelector('.lb-close').focus();
  }
  function hide(){lb.hidden=true;document.body.style.overflow='';}
  links.forEach(function(a,i){a.addEventListener('click',function(e){e.preventDefault();show(i);});});
  lb.querySelector('.lb-close').addEventListener('click',hide);
  lb.querySelector('.lb-prev').addEventListener('click',function(){show(idx-1);});
  lb.querySelector('.lb-next').addEventListener('click',function(){show(idx+1);});
  lb.addEventListener('click',function(e){if(e.target===lb)hide();});
  document.addEventListener('keydown',function(e){
    if(lb.hidden)return;
    if(e.key==='Escape')hide();
    if(e.key==='ArrowLeft')show(idx-1);
    if(e.key==='ArrowRight')show(idx+1);
  });
})();
</script>
