.band{background:var(--yellow);color:var(--ink)}

.epigraph{padding-block:clamp(2.6rem,5vw,4rem);text-align:center}
.epigraph p{font-size:clamp(1.25rem,2.4vw,1.6rem);font-style:italic}
.epigraph cite{display:block;margin-top:.5rem;font-style:normal;font-family:'Fraunces',Georgia,serif;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.grid{columns:3 18rem;gap:1.6rem;padding-bottom:clamp(3rem,6vw,5rem)}
.ph{break-inside:avoid;margin-bottom:1.6rem}
.ph a{display:block;overflow:hidden;border-radius:var(--r)}
.ph img{width:100%;border-radius:var(--r);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ph a:hover img{transform:scale(1.045)}
.ph figcaption{margin-top:.55rem;font-style:italic;font-size:.95rem;color:var(--muted)}

/* ---------- lightbox: blurred page, tilt + directional flip (ported from op-poets.js) ---------- */
.lb[hidden]{display:none}
.lb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(20,18,22,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lb figure{max-width:min(90vw,1000px);max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:.85rem;touch-action:pan-y}
.flipwrap{perspective:1600px;perspective-origin:50% 42%;cursor:pointer}
.cardtilt{transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.flipper{position:relative;transform-style:preserve-3d}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px}
.lb img{max-width:100%;max-height:76vh;width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.45);display:block}
.gloss{position:absolute;inset:0;border-radius:10px;pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%) no-repeat;
  background-size:240% 100%;background-position:125% 0}
.lb .back{position:absolute;inset:0;transform:rotateY(180deg);
  background:var(--ink);color:var(--paper);border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.45);
  display:flex;flex-direction:column;justify-content:center;gap:1.1rem;
  padding:clamp(1.4rem,6%,2.6rem);overflow:hidden}
.flipper.landed .back{overflow:auto;pointer-events:auto}
.flipper.landed .face.front{pointer-events:none}
.lb .back .btitle{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--yellow);font-size:1.3rem}
.lb .back .bpoem{font-style:italic;font-size:1.05rem;line-height:1.75}
.lb .back .bpoem span{display:block}
.lb .back .bnote{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted-inv);font-family:'Fraunces',Georgia,serif}
.lb figcaption{color:#fff;font-style:italic;font-size:1.08rem}
.lb .hint{color:rgba(255,255,255,.55);font-size:.82rem;font-style:italic;margin-top:-.3rem}
.lb .lb-btn{
  position:absolute;width:38px;height:38px;border-radius:999px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:grid;place-items:center;
  transition:transform .26s cubic-bezier(.2,.85,.25,1), background-color .26s, color .26s;
}
.lb .lb-btn svg{display:block;transition:transform .26s cubic-bezier(.2,.85,.25,1)}
.lb .lb-btn:hover{background:var(--yellow);color:var(--ink);border-color:var(--yellow);transform:scale(1.07)}
.lb .lb-btn:hover svg{transform:scale(1.18)}
.lb .lb-btn:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.lb-close{top:1rem;right:1rem}
.lb-prev{left:1rem;top:50%;margin-top:-19px}
.lb-next{right:1rem;top:50%;margin-top:-19px}
@media (prefers-reduced-motion:reduce){.cardtilt{transition:none}}
@media (max-width:560px){.site-head{flex-direction:column;gap:1rem;align-items:flex-start}
  .lb-prev{left:.4rem}.lb-next{right:.4rem}}
</style>

<script>
(function(){
  var links=[].slice.call(document.querySelectorAll('.phlink'));
  var lb=document.getElementById('lb'), img=lb.querySelector('img'), cap=lb.querySelector('figcaption');
  var fig=lb.querySelector('figure'), btitle=lb.querySelector('.btitle');
  var flipwrap=lb.querySelector('.flipwrap'), cardtilt=lb.querySelector('.cardtilt'),
      flipper=lb.querySelector('.flipper'), gloss=lb.querySelector('.gloss');
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var idx=-1, lastFocus=null;

  /* ---- the turn (op-poets.js port): yaw eased per-frame, direction from where you push ---- */
  var yaw=0, spinning=false, tFrom=0, tTo=0, tStart=0, faceBack=false;
  var TURN_MS = reduced ? 1 : 620;
  function easeInOut(k){ return k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2; }
  function paint(){
    flipper.style.transform='rotateY('+yaw.toFixed(2)+'deg)';
    var a=((yaw%360)+360)%360;
    gloss.style.backgroundPosition=(125-(a/180)*170)+'% 0';
  }
  function spin(now){
    var k=Math.min(1,(now-tStart)/TURN_MS);
    yaw=tFrom+(tTo-tFrom)*easeInOut(k);
    paint();
    if(k>=1){ spinning=false; flipper.classList.toggle('landed',faceBack); flipwrap.setAttribute('aria-pressed',faceBack); return; }
    flipper.classList.remove('landed');
    requestAnimationFrame(spin);
  }
  function side(e){
    if(!e||e.clientX==null) return 1;
    var r=flipwrap.getBoundingClientRect();
    return e.clientX < r.left+r.width/2 ? -1 : 1;
  }
  function turn(dir){
    if(spinning) return;
    tFrom=yaw; tTo=yaw+180*(dir<0?-1:1);
    faceBack=!faceBack;
    tStart=performance.now(); spinning=true;
    requestAnimationFrame(spin);
  }
  function faceFront(){ spinning=false; yaw=tFrom=tTo=0; faceBack=false; flipper.classList.remove('landed'); flipwrap.setAttribute('aria-pressed','false'); paint(); }
  flipwrap.addEventListener('click',function(e){ turn(side(e)); });
  flipwrap.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();turn(1);} });

  /* ---- the lean (mouse only; letting go puts the card back flat) ---- */
  function untilt(){ cardtilt.style.transform='none'; }
  flipwrap.addEventListener('pointermove',function(e){
    if(e.pointerType!=='mouse'||reduced) return;
    var r=flipwrap.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    cardtilt.style.transform='rotateX('+(-(y-.5)*13.6).toFixed(2)+'deg) rotateY('+((x-.5)*16).toFixed(2)+'deg)';
  });
  flipwrap.addEventListener('pointerleave',untilt);
  flipwrap.addEventListener('pointerup',untilt);
  flipwrap.addEventListener('pointercancel',untilt);

  /* ---- open/close: the card grows out of the tile you clicked ---- */
  var EASE='cubic-bezier(.19,.86,.24,1)';
  function playOpen(fromEl){
    if(reduced||!fig.animate||!fromEl) return;
    var D=520;
    var to=fig.getBoundingClientRect();
    var r=fromEl.getBoundingClientRect();
    var sc=Math.max(0.08,r.width/to.width);
    var dx=(r.left+r.width/2)-(to.left+to.width/2);
    var dy=(r.top+r.height/2)-(to.top+to.height/2);
    fig.animate([
      {transform:'translate('+dx+'px,'+dy+'px) scale('+sc+')',opacity:.45},
      {transform:'none',opacity:1}
    ],{duration:D,easing:EASE});
    lb.animate([{opacity:0},{opacity:1}],{duration:Math.round(D*.75),easing:'ease-out'});
  }
  function show(i, originEl){
    idx=(i+links.length)%links.length;
    img.src=links[idx].href; img.alt=links[idx].dataset.title;
    cap.textContent=links[idx].dataset.title; btitle.textContent=links[idx].dataset.title;
    faceFront();
    if(lb.hidden){
      lastFocus=document.activeElement; lb.hidden=false; document.body.style.overflow='hidden';
      playOpen(originEl);
      lb.querySelector('.lb-close').focus();
    }
  }
  function hide(){ lb.hidden=true; document.body.style.overflow=''; faceFront(); untilt(); if(lastFocus)lastFocus.focus(); }
  links.forEach(function(a,i){a.addEventListener('click',function(e){e.preventDefault();show(i,a);});});
  lb.querySelector('.lb-close').addEventListener('click',hide);
  lb.querySelector('.lb-prev').addEventListener('click',function(){show(idx-1);});
  lb.querySelector('.lb-next').addEventListener('click',function(){show(idx+1);});
  lb.addEventListener('click',function(e){if(e.target===lb)hide();});
  document.addEventListener('keydown',function(e){
    if(lb.hidden)return;
    if(e.key==='Escape')hide();
    if(e.key==='ArrowLeft')show(idx-1);
    if(e.key==='ArrowRight')show(idx+1);
  });
  var x0=null;
  lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  lb.addEventListener('touchend',function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>40) show(dx<0? idx+1 : idx-1);
  },{passive:true});
})();
</script>
</body>
</html>
